name: TWM CI

on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: node:22-alpine

    steps:
      - uses: actions/checkout@v3
      - name: Install dependencies
        run: |
          npm ci
      - name: Run tests
        run: |
          npm test
