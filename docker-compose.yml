version: "3.9"

services:
  # ─── Backend: Node.js + Express + TypeScript ───────────────────────────────
  backend:
    build:
      context: .
      dockerfile: .devcontainer/backend/Dockerfile
    volumes:
      - .:/workspace:cached
    command: sleep infinity
    networks:
      - twm-network
    ports:
      - "3000:3000"
    depends_on:
      - mongodb
    environment:
      - NODE_ENV=development
      - MONGODB_URI=mongodb://mongodb:27017/twm2026
      - PORT=3000

  # ─── Frontend: Angular SPA ──────────────────────────────────────────────────
  frontend:
    build:
      context: .
      dockerfile: .devcontainer/frontend/Dockerfile
    volumes:
      - .:/workspace:cached
    command: sleep infinity
    networks:
      - twm-network
    ports:
      - "4200:4200"
    environment:
      - NODE_ENV=development

  # ─── MongoDB ────────────────────────────────────────────────────────────────
  mongodb:
    image: mongo:7.0
    restart: unless-stopped
    volumes:
      - mongodb-data:/data/db
    ports:
      - "27017:27017"
    networks:
      - twm-network
    environment:
      - MONGO_INITDB_DATABASE=twm2026

  # ─── Mongo Express (UI de administración) ───────────────────────────────────
  mongo-express:
    image: mongo-express:latest
    restart: unless-stopped
    ports:
      - "8081:8081"
    networks:
      - twm-network
    depends_on:
      - mongodb
    environment:
      - ME_CONFIG_MONGODB_SERVER=mongodb
      - ME_CONFIG_MONGODB_PORT=27017
      - ME_CONFIG_BASICAUTH_USERNAME=admin
      - ME_CONFIG_BASICAUTH_PASSWORD=admin123

networks:
  twm-network:
    driver: bridge

volumes:
  mongodb-data: